<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DTA Super AI v2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }
        header {
            background: #1e293b;
            padding: 12px 15px;
            border-bottom: 2px solid #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.1rem;
            color: #facc15;
        }
        .header-btns {
            display: flex;
            gap: 8px;
        }
        .small-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .small-btn.active {
            background: #22c55e;
            color: #000;
            font-weight: bold;
        }
        #status-bar {
            background: #facc15;
            color: #000;
            text-align: center;
            font-size: 0.85rem;
            padding: 6px;
            display: none;
            font-weight: bold;
            flex-shrink: 0;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .user-msg {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #38bdf8;
        }
        .speak-btn {
            display: inline-block;
            margin-top: 8px;
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
        .input-area {
            padding: 10px;
            background: #1e293b;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #334155;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 1rem;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .btn-mic {
            background: #ef4444;
            color: white;
        }
        .btn-mic.listening {
            background: #22c55e;
            box-shadow: 0 0 12px #22c55e;
        }
    </style>
</head>
<body>

<header>
    <h1>⚡ DTA Voice AI (New)</h1>
    <div class="header-btns">
        <button id="voiceToggle" class="small-btn active" onclick="toggleVoice()">🔊 आवाज़ ON</button>
        <button class="small-btn" onclick="clearChat()">साफ़ करें</button>
    </div>
</header>

<div id="status-bar">🎤 बोलिए, मैं सुन रहा हूँ...</div>

<div id="chat-box">
    <div class="msg ai-msg">
        🎉 बधाई हो! आपका नया <b>DTA Voice AI</b> अपडेट हो गया है। अब कोई API Key नहीं लगेगी!
        <br><button class="speak-btn" onclick="speakText('बधाई हो देवेश! आपका नया डीटीए वॉयस एआई चालू हो गया है। अब आप मुझसे बोलकर बात कर सकते हैं।')">🔊 मेरी आवाज़ टेस्ट करें</button>
    </div>
</div>

<div class="input-area">
    <button id="micBtn" class="btn btn-mic" onclick="startVoice()">🎤</button>
    <input type="text" id="userInput" placeholder="बोलें या यहाँ लिखें..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="btn" onclick="sendMessage()">➤</button>
</div>

<script>
    const chatBox = document.getElementById("chat-box");
    const statusBar = document.getElementById("status-bar");
    const micBtn = document.getElementById("micBtn");
    let autoSpeak = true;

    function toggleVoice() {
        autoSpeak = !autoSpeak;
        const btn = document.getElementById("voiceToggle");
        if (autoSpeak) {
            btn.innerText = "🔊 आवाज़ ON";
            btn.classList.add("active");
        } else {
            window.speechSynthesis.cancel();
            btn.innerText = "🔇 आवाज़ OFF";
            btn.classList.remove("active");
        }
    }

    // फोन के स्पीकर से हिंदी में बोलने का फंक्शन
    function speakText(text) {
        try {
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/[*#_`~]/g, '');
            const msg = new SpeechSynthesisUtterance(cleanText);
            msg.lang = "hi-IN";
            msg.rate = 1.0;

            const allVoices = window.speechSynthesis.getVoices();
            const hindiVoice = allVoices.find(v => v.lang.includes("hi") || v.name.includes("Hindi"));
            if (hindiVoice) msg.voice = hindiVoice;

            msg.onstart = () => {
                statusBar.style.display = "block";
                statusBar.innerText = "🔊 DTA AI बोल रहा है...";
            };
            msg.onend = () => { statusBar.style.display = "none"; };
            msg.onerror = () => { statusBar.style.display = "none"; };

            window.speechSynthesis.speak(msg);
        } catch (e) {
            alert("आवाज़ चलाने में समस्या है।");
        }
    }

    function appendMessage(text, className, isAI = false) {
        const div = document.createElement("div");
        div.className = `msg ${className}`;
        div.innerText = text;

        if (isAI) {
            const btn = document.createElement("button");
            btn.className = "speak-btn";
            btn.innerText = "🔊 सुनें";
            btn.onclick = () => speakText(text);
            div.appendChild(document.createElement("br"));
            div.appendChild(btn);
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const prompt = inputField.value.trim();
        if (!prompt) return;

        window.speechSynthesis.cancel();
        appendMessage(prompt, "user-msg");
        inputField.value = "";
        const loadingMsg = appendMessage("सोच रहा हूँ...", "ai-msg");

        try {
            const sysPrompt = "तुम्हारा नाम DTA Super AI है और तुम्हें देवेश (DTA कंपनी) ने बनाया है। हमेशा हिंदी में छोटा और स्मार्ट जवाब दो।";
            const url = "https://text.pollinations.ai/" + encodeURIComponent(sysPrompt + "\nसवाल: " + prompt);
            const response = await fetch(url);
            const reply = await response.text();
            const finalReply = reply || "माफ़ करें, अभी जवाब नहीं मिल पाया।";

            chatBox.removeChild(loadingMsg);
            appendMessage(finalReply, "ai-msg", true);

            if (autoSpeak) {
                speakText(finalReply);
            }
      } catch (error) {
            loadingMsg.innerText = "इंटरनेट स्लो है, कृपया एक बार फिर से भेजें।";
        }
    }

    function startVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("माइक आपके ब्राउज़र में सपोर्ट नहीं कर रहा है।");
            return;
        }

        window.speechSynthesis.cancel();
        const recognition = new SpeechRecognition();
        recognition.lang = "hi-IN";

        recognition.onstart = () => {
            micBtn.classList.add("listening");
            statusBar.style.display = "block";
            statusBar.innerText = "🎤 अब बोलिए...";
        };

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            document.getElementById("userInput").value = text;
            sendMessage();
        };

        recognition.onerror = (e) => {
            statusBar.style.display = "none";
            micBtn.classList.remove("listening");
            alert("माइक चालू नहीं हो पाया। कृपया ऊपर URL के पास ताले (🔒) के निशान पर क्लिक करके Microphone को Allow करें।");
        };

        recognition.onend = () => {
            statusBar.style.display = "none";
            micBtn.classList.remove("listening");
        };

        recognition.start();
    }

    function clearChat() {
        window.speechSynthesis.cancel();
        chatBox.innerHTML = '<div class="msg ai-msg">चैट साफ़ हो गई! बताइए मैं क्या मदद करूँ?</div>';
    }
</script>

</body>
    </html>
