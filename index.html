<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTA Super AI - Voice Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            padding: 14px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.15rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-btns {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .small-btn {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .small-btn.active {
            background: #22c55e;
            color: #052e16;
            font-weight: bold;
        }
        #status-bar {
            background: #1e293b;
            color: #38bdf8;
            text-align: center;
            font-size: 0.85rem;
            padding: 6px;
            display: none;
            border-bottom: 1px solid #334155;
            font-weight: bold;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 82%;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
        }
        .user-msg {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .speak-again {
            display: inline-block;
            margin-top: 8px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            cursor: pointer;
        }
        .input-area {
            padding: 12px;
            background: #1e293b;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #334155;
        }
        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 1rem;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-mic {
            background: #ef4444;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-mic.listening {
            background: #22c55e;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); transform: scale(1.08); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); transform: scale(1); }
        }
    </style>
</head>
<body>

<header>
    <h1>🤖 DTA Super AI</h1>
    <div class="header-btns">
        <button id="voiceToggle" class="small-btn active" onclick="toggleVoice()">🔊 आवाज़ चालू</button>
        <button class="small-btn" onclick="clearChat()">साफ़ करें</button>
    </div>
</header>

<div id="status-bar">🎤 बोलिए, मैं सुन रहा हूँ...</div>

<div id="chat-box">
    <div class="msg ai-msg">
        नमस्ते! मैं DTA Super AI हूँ। अब मैं आपकी बात सुन भी सकता हूँ और अपनी आवाज़ में बोलकर जवाब भी दे सकता हूँ! नीचे 🎤 माइक दबाकर बोलिए।
        <br><button class="speak-again" onclick="speakText('नमस्ते! मैं डीटीए सुपर एआई हूँ। अब मैं आपकी बात सुन भी सकता हूँ और अपनी आवाज़ में बोलकर जवाब भी दे सकता हूँ!')">🔊 सुनें</button>
    </div>
</div>

<div class="input-area">
    <button id="micBtn" class="btn btn-mic" onclick="startVoice()" title="माइक से बोलें">🎤</button>
    <input type="text" id="userInput" placeholder="बोलें या यहाँ लिखें..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="btn" onclick="sendMessage()">➤</button>
</div>

<script>
    const chatBox = document.getElementById("chat-box");
    const statusBar = document.getElementById("status-bar");
    const micBtn = document.getElementById("micBtn");
    let autoSpeak = true;
    let voices = [];

    // ब्राउज़र की हिंदी आवाज़ें लोड करना
    function loadVoices() {
        voices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    // आवाज़ चालू/बंद करने का बटन
    function toggleVoice() {
        autoSpeak = !autoSpeak;
        const btn = document.getElementById("voiceToggle");
        if (autoSpeak) {
            btn.innerText = "🔊 आवाज़ चालू";
            btn.classList.add("active");
        } else {
            window.speechSynthesis.cancel();
            btn.innerText = "🔇 आवाज़ बंद";
            btn.classList.remove("active");
        }
    }

    // AI की आवाज़ में बोलने वाला फंक्शन
    function speakText(text) {
        if (!('speechSynthesis' in window)) {
            alert("आपके फोन के इस ब्राउज़र में बोलने का सपोर्ट नहीं है। कृपया Chrome में खोलें।");
            return;
        }

        // पहले से कुछ बोल रहा हो तो रोकें
        window.speechSynthesis.cancel();

        // बोलने से पहले स्टार (*), हैश (#) और इमोजी हटाना ताकि आवाज़ साफ़ आए
        const cleanText = text.replace(/[*#_`~]/g, '').replace(/[\u{1F600}-\u{1F6FF}]/gu, '');

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = "hi-IN";
        utterance.rate = 1.0;  // बोलने की स्पीड
        utterance.pitch = 1.05; // मीठी और साफ़ आवाज़ के लिए पिच

        // अगर फोन में Google Hindi आवाज़ हो तो उसे चुनना
        const hindiVoice = voices.find(v => v.lang.includes("hi") || v.name.includes("Hindi"));
        if (hindiVoice) {
            utterance.voice = hindiVoice;
        }

        utterance.onstart = () => {
            statusBar.style.display = "block";
            statusBar.innerText = "🔊 DTA AI बोल रहा है...";
        };
        utterance.onend = () => {
            statusBar.style.display = "none";
        };
        utterance.onerror = () => {
            statusBar.style.display = "none";
        };

        window.speechSynthesis.speak(utterance);
    }

    function appendMessage(text, className, isAI = false) {
        const div = document.createElement("div");
        div.className = `msg ${className}`;
        div.innerText = text;

        if (isAI) {
            const btn = document.createElement("button");
            btn.className = "speak-again";
            btn.innerText = "🔊 फिर से सुनें";
            btn.onclick = () => speakText(text);
            div.appendChild(document.createElement("br"));
            div.appendChild(btn);
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const prompt = inputField.value.trim();

        if (!prompt) return;

        // जब नया सवाल पूछें तो पुरानी आवाज़ रोक दें
        window.speechSynthesis.cancel();

        appendMessage(prompt, "user-msg");
        inputField.value = "";
        const loadingMsg = appendMessage("सोच रहा हूँ...", "ai-msg");

        try {
            const systemRule = "तुम्हारा नाम DTA Super AI है और तुम्हें DTA कंपनी (देवेश) ने बनाया है। हमेशा बहुत दोस्ताना और स्मार्ट तरीके से हिंदी में जवाब दो। जवाब छोटा और साफ़ रखो ताकि बोलकर सुनाने में अच्छा लगे।";
            const response = await fetch("https://text.pollinations.ai/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    messages: [
                        { role: "system", content: systemRule },
                        { role: "user", content: prompt }
                    ],
                    model: "openai"
                })
            });

            const reply = await response.text();
            const finalReply = reply || "माफ़ करें, अभी जवाब नहीं मिल पाया।";

            chatBox.removeChild(loadingMsg);
            appendMessage(finalReply, "ai-msg", true);

            // अगर आवाज़ चालू है तो अपने आप बोलकर सुनाए
            if (autoSpeak) {
                speakText(finalReply);
            }
        } catch (error) {
            loadingMsg.innerText = "इंटरनेट कनेक्शन में कोई समस्या है, कृपया दोबारा प्रयास करें।";
        }
    }

    // माइक से आपकी आवाज़ सुनने का फंक्शन
    function startVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("माइक चालू करने के लिए कृपया इस लिंक को Google Chrome ब्राउज़र में खोलें।");
            return;
        }

        // अगर AI बोल रहा हो तो उसे चुप कराएं ताकि आपकी बात सुन सके
        window.speechSynthesis.cancel();

        const recognition = new SpeechRecognition();
        recognition.lang = "hi-IN";
        recognition.interimResults = false;

        recognition.onstart = function() {
            micBtn.classList.add("listening");
            statusBar.style.display = "block";
            statusBar.innerText = "🎤 बोलिए, मैं सुन रहा हूँ...";
        };

        recognition.onresult = function(event) {
            const spokenText = event.results[0][0].transcript;
            document.getElementById("userInput").value = spokenText;
            sendMessage();
        };

        recognition.onerror = function() {
            statusBar.style.display = "none";
            micBtn.classList.remove("listening");
        };

        recognition.onend = function() {
            statusBar.style.display = "none";
            micBtn.classList.remove("listening");
        };

        recognition.start();
    }

    function clearChat() {
        window.speechSynthesis.cancel();
        chatBox.innerHTML = '<div class="msg ai-msg">चैट साफ़ हो गई! बताइए, अब मैं आपकी क्या मदद करूँ?</div>';
    }
</script>

</body>
    </html>
